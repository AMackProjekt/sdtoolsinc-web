name: Dependency Updates Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    name: Check for Outdated Dependencies
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check root dependencies
        run: |
          echo "=== Root Package Dependencies ===" >> $GITHUB_STEP_SUMMARY
          npm outdated || echo "No outdated packages" >> $GITHUB_STEP_SUMMARY

      - name: Check root portal dependencies
        run: |
          cd apps/client-portal
          echo "=== Client Portal Dependencies ===" >> $GITHUB_STEP_SUMMARY
          npm outdated || echo "No outdated packages"

      - name: Check case manager portal dependencies
        run: |
          cd apps/casemgr-portal
          echo "=== Case Manager Portal Dependencies ===" >> $GITHUB_STEP_SUMMARY
          npm outdated || echo "No outdated packages"

      - name: Check admin portal dependencies
        run: |
          cd apps/admin-portal
          echo "=== Admin Portal Dependencies ===" >> $GITHUB_STEP_SUMMARY
          npm outdated || echo "No outdated packages"

      - name: Check API dependencies
        run: |
          cd api
          echo "=== API Dependencies ===" >> $GITHUB_STEP_SUMMARY
          npm outdated || echo "No outdated packages"

      - name: Create issue for major updates
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            
            if (summary.includes('outdated')) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Dependency Updates Available',
                body: `## Weekly Dependency Check\n\nOutdated packages detected. Review and update as needed:\n\n${summary}`,
                labels: ['dependencies', 'maintenance']
              });
            }
