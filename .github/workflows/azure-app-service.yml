name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: sdtoolsinc-web
  AZURE_RESOURCE_GROUP: sdtoolsinc_group-a7cd
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Build Next.js application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    
    - name: Create deployment package
      run: |
        # Create a production-ready package
        mkdir -p deployment
        cp -r .next/standalone/* deployment/
        cp -r public deployment/ 2>/dev/null || true
        cp package.json deployment/
        cp package-lock.json deployment/
        
        # Create ZIP file
        cd deployment
        zip -r ../app.zip . > /dev/null
        cd ..
        
        # Verify ZIP was created
        ls -lh app.zip
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure App Service
      run: |
        az webapp deployment source config-zip \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --src-path app.zip
    
    - name: Verify deployment
      run: |
        echo "Deployment completed!"
        echo "Web app is available at: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

